[project]
name = "multi-factor-stock-picker"
version = "2.0.0"
description = "Multi-factor stock research framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
research = [
    "vectorbt>=0.26",
    "numba>=0.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/config",
    "src/schemas",
    "src/data",
    "src/data/loaders",
    "src/data/store",
    "src/data/universe",
    "src/data/corporate_actions",
    "src/data/validation",
    "src/entry_signals",
    "src/entry_signals/examples",
    "src/entry_signals/momentum",
    "src/exit_signals",
    "src/exit_signals/examples",
    "src/exit_signals/stop_loss",
    "src/exit_signals/trailing_stop",
    "src/backtest",
    "src/factors",
    "src/factors/scoring",
    "src/factors/combination",
    "src/factors/ic",
    "src/factors/performance",
    "src/evaluation",
    "src/evaluation/exit",
    "src/evaluation/exit/robustness",
    "src/evaluation/robustness",
    "src/research",
    "src/reporting",
    "src/experiments",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = [
    "core",
    "config",
    "schemas",
    "data",
    "entry_signals",
    "exit_signals",
    "backtest",
    "factors",
    "evaluation",
    "research",
    "reporting",
    "experiments",
]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
